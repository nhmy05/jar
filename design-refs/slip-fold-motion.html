<title>Slip Fold Motion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one stage (3D scene) on top, a slim control strip, then the beat sheet + tuning side by side (stacks on phone). */
:root{
  --bg:#FBF4DA; --surface:#FFFBEA; --ink:#2F2A1E; --muted:#7A7158; --line:#E6D9A8;
  --accent:#D9822B; --accent-ink:#FFFFFF; --active:#FCE9B8;
  --display:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1B14; --surface:#29251B; --ink:#F3ECD6; --muted:#ADA386; --line:#3E3826;
  --accent:#F0A24E; --accent-ink:#1E1B14; --active:#3D3420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1B14; --surface:#29251B; --ink:#F3ECD6; --muted:#ADA386; --line:#3E3826;
  --accent:#F0A24E; --accent-ink:#1E1B14; --active:#3D3420; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:60ch}
.stage{position:relative;width:100%;aspect-ratio:16/10;max-height:68vh;border-radius:18px;overflow:hidden;background:#F3E3A0;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%}
.beatTag{position:absolute;left:14px;top:12px;font-family:var(--display);font-size:28px;color:#4A3F22;pointer-events:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
button{font:600 14px var(--body);border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:96px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 12px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--active)}
.scrub{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0}
.scrub input{flex:1;min-width:0;accent-color:var(--accent)}
.time{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.panel h2{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
ol.beats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.beats li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
ol.beats li.on{background:var(--active)}
ol.beats .t{font:400 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
ol.beats b{font-weight:600}
ol.beats span.d{color:var(--muted)}
.tune{display:flex;flex-direction:column;gap:12px}
.tune label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.tune .row{display:flex;justify-content:space-between}
.tune .row span:last-child{font:400 12px var(--mono);color:var(--muted)}
.tune input{accent-color:var(--accent);width:100%}
.note{font-size:13px;color:var(--muted);margin:4px 0 0}
</style>

<div class="wrap">
  <header>
    <h1>Slip fold &amp; drop</h1>
    <p>Motion study for the dinner jar, copied from the reference video. Fold, fold, lift, drop.</p>
  </header>

  <div class="stage" id="stage"><div class="beatTag" id="beatTag">ready</div></div>

  <div class="controls">
    <button class="primary" id="play">Pause</button>
    <div class="seg" role="group" aria-label="Speed">
      <button data-s="0.25" aria-pressed="false">¼×</button>
      <button data-s="0.5" aria-pressed="false">½×</button>
      <button data-s="1" aria-pressed="true">1×</button>
    </div>
    <div class="scrub"><input type="range" id="scrub" min="0" max="3.3" step="0.005" value="0" aria-label="Timeline"><span class="time" id="time">0.00s</span></div>
    <label class="chk"><input type="checkbox" id="loop" checked> Loop</label>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Beats (app pace)</h2>
      <ol class="beats" id="beats"></ol>
      <p class="note">The video takes 8s. Here the crease sets as each fold closes, and the slip drops straight from the hand. Click a beat to jump there.</p>
    </div>
    <div class="panel tune">
      <h2>Tuning</h2>
      <label for="open"><div class="row"><span>Rest opening (fold relaxes after landing)</span><span id="openV">1.00</span></div>
        <input type="range" id="open" min="0" max="2" step="0.05" value="1"></label>
      <label for="roll"><div class="row"><span>Fold softness (bend before crease)</span><span id="rollV">1.0</span></div>
        <input type="range" id="roll" min="0.2" max="1.6" step="0.05" value="1"></label>
      <label for="bounce"><div class="row"><span>Landing bounce</span><span id="bounceV">1.0</span></div>
        <input type="range" id="bounce" min="0" max="2" step="0.05" value="1"></label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const TOTAL=3.3;
const BEATS=[
  {a:0.00,b:0.30,name:"Hold",d:"Flat note in hand"},
  {a:0.30,b:1.00,name:"Fold 1",d:"Sheet bows, rolls over, crease sets as it closes"},
  {a:1.00,b:1.75,name:"Fold 2",d:"Same bend-and-roll, other axis. Writing ends up inside"},
  {a:1.75,b:2.15,name:"Drop",d:"Let go from the hand. Falls straight down, tips flat, folds start to relax open"},
  {a:2.15,b:2.50,name:"Land",d:"One small bounce"},
  {a:2.50,b:3.30,name:"Settle",d:"Fold relaxes open a little, then still"}
];
const W=3, H=2.2, PI=Math.PI;
const tune={flex:0,puff:1,roll:1,bounce:1,open:1};

/* ---------- helpers ---------- */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eout=p=>1-Math.pow(1-p,3);
const ein=p=>p*p;

/* bend a flap: distance d from crease, total angle th, soft bend length b.
   returns [in-plane u, out-of-plane w, local angle phi] */
function bend(d,th,b){
  if(th<1e-5) return [d,0,0];
  if(b<1e-4) return [d*Math.cos(th),d*Math.sin(th),th];
  const k=th/b;
  if(d<=b){const f=k*d;return [Math.sin(f)/k,(1-Math.cos(f))/k,f];}
  return [Math.sin(th)/k+(d-b)*Math.cos(th),(1-Math.cos(th))/k+(d-b)*Math.sin(th),th];
}

/* ---------- pose at time t ---------- */
function pose(t){
  const P={};
  const REST=PI;
  const R=tune.roll;
  // fold 1: crease tightens as the fold closes (no separate press)
  const p1=seg(t,0.30,0.95);
  P.th1=REST*eio(p1);
  P.b1=lerp(1.15*R,0.012,eio(p1));
  P.bow=Math.sin(PI*clamp(p1/0.55))*0.32*R*(1-p1*0.6);
  // fold 2
  const p2=seg(t,1.05,1.70);
  P.th2=REST*eio(p2);
  P.b2=lerp(0.95*R,0.045,eio(p2));
  P.bow2=0;
  P.s1=eio(p1); P.s2=eio(p2);

  // flex in fall + snap on land
  const pf=seg(t,1.75,2.15), pl=seg(t,2.15,2.50), ps=seg(t,2.50,3.20);
  let flex=Math.pow(Math.sin(PI*Math.min(1,pf*1.05)),1.3)*tune.flex;
  if(t>=2.15) flex=-0.10*tune.flex*Math.sin(PI*pl)*(1-pl);
  P.th1-=flex*0.7; P.th2-=flex*0.85;
  P.b1+=Math.max(0,flex)*0.18; P.b2+=Math.max(0,flex)*0.22;
  // after landing the folds relax open a little, like real paper
  const relax=eout(seg(t,1.75,2.9))*0.3*tune.open;
  P.th1-=relax*0.15; P.th2-=relax; P.b2+=relax*0.15;

  // world transform
  const HOLD={x:0,y:1.75,z:1.55}, TILT=0.92;
  let x=HOLD.x, y=HOLD.y, z=HOLD.z, rx=PI/2+TILT, ry=0, rz=0;

  P.fall=false;
  if(t>=1.75){
    P.fall=true;
    const pp=Math.min(1,pf);
    y=lerp(HOLD.y,0,ein(pp));
    z=HOLD.z; x=HOLD.x;
    const tilt0=PI/2+TILT;
    rx=lerp(tilt0,PI/2,eio(pp));
    ry=0; rz=0;
    if(t>=2.15){
      const bnc=Math.abs(Math.sin(PI*2*pl))*Math.exp(-4.5*pl)*0.16*tune.bounce;
      y=bnc; rx=PI/2+Math.sin(PI*2*pl)*Math.exp(-4*pl)*0.06*tune.bounce;
      rz=0; ry=0; x=HOLD.x; z=HOLD.z;
    }
  }
  Object.assign(P,{x,y,z,rx,ry,rz});
  return P;
}

/* ---------- three setup ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
stage.prepend(renderer.domElement);

const scene=new THREE.Scene();
const BG=new THREE.Color('#F3E3A0').convertSRGBToLinear();
scene.background=BG; scene.fog=new THREE.Fog(BG,14,30);
const camera=new THREE.PerspectiveCamera(34,16/10,0.05,100);
camera.position.set(0,5.0,6.6); camera.lookAt(0,1.0,0.3);

scene.add(new THREE.HemisphereLight(0xfff8e6,0xb9a46a,0.6));
const sun=new THREE.DirectionalLight(0xffffff,0.65);
sun.position.set(2.5,8,3.5); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:20});
sun.shadow.radius=4; sun.shadow.bias=-0.0003; sun.shadow.normalBias=0.01;
scene.add(sun);

const table=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:new THREE.Color('#EED98A').convertSRGBToLinear(),roughness:0.95}));
table.rotation.x=-PI/2; table.receiveShadow=true; scene.add(table);

/* paper textures */
function makeFront(){
  const c=document.createElement('canvas'); c.width=1200; c.height=880;
  const g=c.getContext('2d');
  g.fillStyle='#FBEBA6'; g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#3B3557'; g.font='700 150px Caveat, "Segoe Print", cursive';
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillText('Phở bò',c.width*0.5,c.height*0.5+40);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8;
  return t;
}
function makeBack(){
  const c=document.createElement('canvas'); c.width=600; c.height=440;
  const g=c.getContext('2d');
  g.fillStyle='#F2E09A'; g.fillRect(0,0,600,440);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
}
const geo=new THREE.PlaneGeometry(W,H,64,48);
const base=geo.attributes.position.array.slice();
const frontTex=makeFront();
// viewer side is the geometry's back face (-z); mirror u so text reads right
frontTex.wrapS=THREE.RepeatWrapping; frontTex.repeat.x=-1; frontTex.offset.x=1;
const backTex=makeBack();
const front=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:frontTex,side:THREE.BackSide,roughness:0.9}));
const back=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:backTex,side:THREE.FrontSide,roughness:0.9}));
front.castShadow=back.castShadow=true; front.receiveShadow=back.receiveShadow=true;
const shift=new THREE.Group(); shift.add(front,back);
const spin=new THREE.Group(); spin.rotation.z=PI; spin.add(shift);
const outer=new THREE.Group(); outer.rotation.order='YXZ'; outer.add(spin); scene.add(outer);

if(document.fonts&&document.fonts.load){
  document.fonts.load('700 150px Caveat').then(()=>{const nt=makeFront();frontTex.image=nt.image;frontTex.needsUpdate=true;}).catch(()=>{});
}

function deform(P){
  const pos=geo.attributes.position.array;
  let maxZ=0;
  for(let i=0;i<pos.length;i+=3){
    let x=base[i], y=base[i+1], z=0;
    // gentle whole-sheet bow (anticipation)
    z-=P.bow*Math.pow(x/(W/2),2)*0.5 + P.bow2*Math.pow(y/(H/2),2)*0.35*(x>=0?1:0.6);
    // fold 1: right half over, toward viewer (-z) so the writing ends up inside
    {const c=0.006; if(x<c){const r=bend(c-x,P.th1,P.b1); const zl=-z; x=c-(r[0]-zl*Math.sin(r[2])); z=-(r[1]+zl*Math.cos(r[2]));}} // crease nudged by half the bend so the flap edge lands exactly on the far edge
    // fold 2: top half over, also toward viewer
    {const c=-0.0225; if(y>c){const r=bend(y-c,P.th2,P.b2); const zl=-z; y=c+r[0]-zl*Math.sin(r[2]); z=-(r[1]+zl*Math.cos(r[2]));}}
    pos[i]=x; pos[i+1]=y; pos[i+2]=z;
    if(z>maxZ) maxZ=z;
  }
  geo.attributes.position.needsUpdate=true;
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
  return maxZ;
}

function apply(t){
  const P=pose(t);
  const maxZ=deform(P);
  shift.position.set(-W/4*P.s1, H/4*P.s2, 0);
  outer.rotation.set(P.rx,P.ry,P.rz);
  // on the table, the stack hangs below the visible face; lift so nothing sinks in
  const restY=P.fall? maxZ*Math.max(0.6,Math.sin(P.rx))+0.004 : 0;
  outer.position.set(P.x,P.y+restY,P.z);
  renderer.render(scene,camera);
}

/* ---------- UI ---------- */
const playBtn=document.getElementById('play'), scrub=document.getElementById('scrub'),
      timeEl=document.getElementById('time'), loopEl=document.getElementById('loop'),
      beatTag=document.getElementById('beatTag'), beatsEl=document.getElementById('beats');
BEATS.forEach((b,i)=>{
  const li=document.createElement('li'); li.tabIndex=0;
  li.innerHTML=`<span class="t">${b.a.toFixed(2)}–${b.b.toFixed(2)}s</span><span><b>${b.name}</b> <span class="d">· ${b.d}</span></span>`;
  const go=()=>{t=b.a+0.001;playing=true;setPlay();};
  li.onclick=go; li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
  beatsEl.appendChild(li);
});
const lis=[...beatsEl.children];
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=reduce?1.0:0, speed=1, playing=!reduce, last=performance.now();
function setPlay(){playBtn.textContent=playing?'Pause':(t>=TOTAL-0.001?'Replay':'Play');}
setPlay();
playBtn.onclick=()=>{ if(t>=TOTAL-0.001) t=0; playing=!playing; setPlay(); };
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  speed=+b.dataset.s; document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
});
scrub.oninput=()=>{t=+scrub.value;playing=false;setPlay();};
[['open'],['roll'],['bounce']].forEach(([k])=>{
  const el=document.getElementById(k), v=document.getElementById(k+'V');
  el.oninput=()=>{tune[k]=+el.value; v.textContent=(+el.value).toFixed(2);};
});

function resize(){
  const r=stage.getBoundingClientRect();
  renderer.setSize(r.width,r.height,false);
  camera.aspect=r.width/r.height;
  camera.fov=r.width<520?44:34;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

let hold=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing){
    t+=dt*speed;
    if(t>=TOTAL){
      if(loopEl.checked){ hold+=dt; t=TOTAL; if(hold>0.6){t=0;hold=0;} }
      else { t=TOTAL; playing=false; setPlay(); }
    }
  }
  apply(t);
  scrub.value=t; timeEl.textContent=t.toFixed(2)+'s';
  let idx=BEATS.findIndex(b=>t>=b.a&&t<b.b); if(idx<0) idx=BEATS.length-1;
  lis.forEach((li,i)=>li.classList.toggle('on',i===idx));
  beatTag.textContent=BEATS[idx].name.toLowerCase();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
